name: echonotes_server
description: A new Dart Frog application
version: 1.0.0+1
publish_to: none

# The Dart in the Flutter SDK pinned in the repository's .fvmrc (Flutter
# 3.47.5 with Dart 3.13.4), which the Docker image matches. Run every command
# through FVM (`fvm dart`): an older Dart fails here instead.
environment:
  sdk: ^3.13.4

dependencies:
  dart_frog: ^1.2.6

dev_dependencies:
  dart_frog_lint: ^0.1.2
  mocktail: ^1.0.5
  test: ^1.32.0
